[package]
name = "app"
version = "0.2.1"
description = "ClipVault - Win+V enhanced"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon", "test"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.58", features = [
  "implement",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_SystemServices",
  "Win32_System_Ole",
  "Win32_UI_Shell",
] }
# #[implement] codegen expands to windows_core:: paths — needs the crate as a
# direct dependency (windows re-exports it, but the macro's generated code
# doesn't go through that re-export).
windows-core = "0.58"

# NOTE: [profile.release] lives at the WORKSPACE root (../Cargo.toml) — cargo
# ignores profiles declared in a non-root member.

[dev-dependencies]
# ipc_contract (tests/ipc_contract.rs) drives the real invoke handler on a
# tauri mock runtime; the feature is unified into the lib for test builds.
tauri = { version = "2.11.3", features = ["test"] }
