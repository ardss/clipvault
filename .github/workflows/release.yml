name: Release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Assert tag matches tauri.conf.json version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $conf) { throw "tag v$tag != tauri.conf.json version $conf — bump versions before tagging" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
        cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - run: npm ci
      # full bundle: NSIS installer (+ the bare exe as a portable fallback)
      - run: npx tauri build
      - name: Collect artifacts + checksums
        shell: pwsh
        run: |
          $out = "release-assets"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/ClipVault_*_x64-setup.exe" $out
          Copy-Item "src-tauri/target/release/app.exe" "$out/ClipVault_${{ github.ref_name }}-portable.exe"
          # hash only the exes, then write the file once — never let the
          # checksum file hash itself
          $lines = Get-ChildItem "$out/*.exe" | ForEach-Object {
            $h = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          Set-Content -Path "$out/SHA256SUMS.txt" -Value $lines
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.exe
            release-assets/SHA256SUMS.txt
          draft: true
          fail_on_unmatched_files: true
